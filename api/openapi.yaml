openapi: 3.1.0
info:
  title: Network Topology Builder API
  version: 0.1.0
  description: |
    Contract between frontend and backend (ADR-017). Edit this file first, then run `make gen`.

    Authentication: session cookie `ntb_session` (HttpOnly, SameSite=Lax) set by POST /auth/login.
    Every state-changing request except login must send header `X-CSRF-Token` with the token
    returned by /auth/login or /auth/me.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness + database check
      security: []
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and clear the session cookie
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentSession
      summary: Current user and CSRF token
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/mfa/setup:
    post:
      operationId: setupMfa
      summary: Start TOTP enrollment (returns the secret and a QR code once)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Enrollment started; confirm with /auth/mfa/enable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/enable:
    post:
      operationId: enableMfa
      summary: Confirm enrollment with a code; returns one-time recovery codes
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '200':
          description: MFA enabled; recovery codes are shown only now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodes'
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Complete sign-in with a TOTP code or a recovery code
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Session is now MFA-verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Too many attempts; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/mfa/disable:
    post:
      operationId: disableMfa
      summary: Turn off MFA (not allowed when MFA is mandatory for the account)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '204':
          description: MFA disabled
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: MFA is mandatory for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs:
    get:
      operationId: listMyOrganizations
      summary: Organizations the current user belongs to
      responses:
        '200':
          description: Memberships, sorted by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganizations'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getOrganization
      summary: Organization details and the caller's membership
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOrganization
      summary: Rename / edit notes (owner, admin). Optimistic lock on version.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/activate:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: activateOrganization
      summary: Remember this organization as the default to open after sign-in
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Saved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations:
    get:
      operationId: adminListOrganizations
      summary: All organizations (system admin)
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: adminCreateOrganization
      summary: Create an organization (system admin)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/organizations/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    delete:
      operationId: adminDeleteOrganization
      summary: Soft-delete an organization (system admin, ADR-022)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted (hidden everywhere; history kept)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ntb_session

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization (tenant) the request is scoped to (ADR-023)
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Not found (also returned for organizations the caller does not belong to)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Signed in but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with the current MFA state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCode:
      description: The code is wrong, expired or already used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        database:
          type: string
          enum: [ok, unavailable]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024

    CurrentUser:
      type: object
      required: [id, email, displayName, isSystemAdmin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        isSystemAdmin:
          type: boolean

    AuthSession:
      type: object
      required: [user, csrfToken, mfa, activeOrganizationId]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
        mfa:
          $ref: '#/components/schemas/MfaStatus'
        activeOrganizationId:
          description: Organization used last (UI default only; access is checked per request)
          type: [string, 'null']
          format: uuid

    MfaStatus:
      type: object
      description: |
        enabled = TOTP enrolled; verified = code entered this session; required = mandatory for this
        account (system admin / org owner / org admin). The session is fully usable only when
        (enabled and verified) or (not enabled and not required).
      required: [enabled, verified, required]
      properties:
        enabled:
          type: boolean
        verified:
          type: boolean
        required:
          type: boolean

    MfaSetup:
      type: object
      required: [secret, otpauthUrl, qrCode]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry
        otpauthUrl:
          type: string
        qrCode:
          type: string
          description: PNG data URL of the otpauth QR code

    MfaCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    MfaVerifyRequest:
      type: object
      description: Provide either a TOTP code or a recovery code.
      properties:
        code:
          type: string
          maxLength: 16
        recoveryCode:
          type: string
          maxLength: 32

    MfaRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    OrganizationKind:
      type: string
      enum: [internal, customer]

    Role:
      type: string
      enum: [owner, admin, editor, viewer]

    OrganizationSummary:
      type: object
      required: [id, name, kind, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        role:
          $ref: '#/components/schemas/Role'

    MyOrganizations:
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummary'

    Organization:
      type: object
      required: [id, name, kind, notes, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MembershipInfo:
      type: object
      required: [role, permissions]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string

    OrganizationView:
      type: object
      required: [organization, membership]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        membership:
          $ref: '#/components/schemas/MembershipInfo'

    UpdateOrganizationRequest:
      type: object
      required: [name, notes, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 2000
        version:
          type: integer
          format: int32
          description: Version the client last saw; mismatch → 409

    AdminOrganization:
      type: object
      required: [id, name, kind, notes, memberCount, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
        memberCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32

    AdminOrganizationList:
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganization'

    CreateOrganizationRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
          maxLength: 2000
        addMeAsOwner:
          type: boolean
          default: true
          description: Make the creating system admin an owner (otherwise nobody can access it until P1-04 adds members)
