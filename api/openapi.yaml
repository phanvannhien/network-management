  /admin/users/{userId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: adminCreatePasswordReset
      summary: Issue a one-time password-reset link (24 h)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLink'
        '401':
