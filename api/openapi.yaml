      type: object
      required: [pattern, start, count]
      description: Ports named by pattern with {n} replaced by start … start+count-1 and {m} by the stack member number (1 outside a cluster), e.g. Gi{m}/0/{n}
      properties:
        pattern:
          type: string
          minLength: 1
          maxLength: 60
        start:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 512
        media:
          $ref: '#/components/schemas/InterfaceMedia'
        speed:
          type: string
          maxLength: 20
        poe:
          type: boolean

    DeviceTemplateInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/DeviceType'
        vendor:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        partNumber:
          type: string
          maxLength: 100
        uHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        ports:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PortGroup'
        notes:
          type: string
          maxLength: 2000

    DeviceTemplateUpdate:
      type: object
      required: [name, type, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/DeviceType'
        vendor:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        partNumber:
          type: string
          maxLength: 100
        uHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        ports:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PortGroup'
        notes:
          type: string
          maxLength: 2000
        version:
          type: integer
          format: int32

    DeviceTemplate:
      type: object
      required: [id, name, type, vendor, model, partNumber, uHeight, ports, portCount, notes, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/DeviceType'
        vendor:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        partNumber:
          type: string
          maxLength: 100
        uHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        ports:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PortGroup'
        notes:
          type: string
          maxLength: 2000
        portCount:
          type: integer
          format: int32
        version:
          type: integer
          format: int32

    DeviceTemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/DeviceTemplate'

    DeviceCatalog:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModel'

    CatalogModel:
      type: object
      required: [id, vendor, family, model, partNumbers, aliases, type, uHeight, ports, portCount, verified, source, notes, images, lifecycle]
      properties:
        id:
          type: string
        vendor:
          type: string
        family:
          type: string
        model:
          type: string
        partNumbers:
          type: array
          items:
            type: string
        aliases:
          type: array
          items:
            type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        uHeight:
          type: integer
          format: int32
        ports:
          type: array
          items:
            $ref: '#/components/schemas/PortGroup'
        portCount:
          type: integer
          format: int32
        verified:
          type: boolean
          description: port layout checked against the vendor datasheet at source
        source:
          type: string
        notes:
          type: string
        images:
          $ref: '#/components/schemas/CatalogImages'
        lifecycle:
          $ref: '#/components/schemas/CatalogLifecycle'

    CatalogLifecycle:
      type: object
      description: Vendor milestones of the model (P2-22), ISO dates, empty when not announced
      required: [endOfSale, endOfSupport, source]
      properties:
        endOfSale:
          type: string
          description: last day to order
        endOfSupport:
          type: string
          description: last day of vendor support (Cisco LDoS)
        source:
          type: string
          description: the vendor's end-of-life notice

    LifecycleFill:
      type: object
      required: [id, hostname, model, eolDate, eosDate]
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        model:
          type: string
        eolDate:
          type: [string, 'null']
          format: date
          description: end-of-sale date written (null = left as it was)
        eosDate:
          type: [string, 'null']
          format: date
          description: end-of-support date written (null = left as it was)

    CatalogImages:
      type: object
      description: Photos of the model (P2-12); file names for getCatalogImage, empty when there is none
      required: [front, rear, source, similarTo]
      properties:
        front:
          type: string
        rear:
          type: string
        source:
          type: string
          description: where the photos come from (NetBox device type library page)
        similarTo:
          type: string
          description: the photos show this sibling model (same chassis, other uplinks / PoE), not the model itself; empty when they are its own

    MgmtIpResult:
      type: object
      required: [mgmtIp, interfaceName, warnings]
      properties:
        mgmtIp:
          type: string
        interfaceName:
          type: string
        warnings:
          type: array
          items:
            type: string

    ExportEvent:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [diagram_png, diagram_svg, devices_xlsx, diagram_ntb]
        diagramId:
          type: string
          format: uuid
          description: the exported diagram (diagram_png / diagram_svg)
        count:
          type: integer
          minimum: 0
          maximum: 1000000
          description: rows exported (devices_xlsx)
        scale:
          type: integer
          minimum: 1
          maximum: 4

    NtbFile:
      type: object
      additionalProperties: true
      description: a .ntb.json document — its shape is schema/ntb.schema.json (v2), checked by the server

    NtbPreview:
      type: object
      required: [diagramName, sites, devices, counts]
      properties:
        diagramName:
          type: string
        sites:
          type: array
          items:
            type: object
            required: [ref, code, name]
            properties:
              ref:
                type: string
              code:
                type: string
              name:
                type: string
              siteId:
                type: string
                format: uuid
                description: proposed target site (same code or name in this organization)
        devices:
          type: array
          items:
            type: object
            required: [ref, hostname, siteRef]
            properties:
              ref:
                type: string
              hostname:
                type: string
              siteRef:
                type: string
              existingId:
                type: string
                format: uuid
                description: a device of that hostname already in the proposed site
        counts:
          type: object
          required: [devices, links, endpointGroups, clusters]
          properties:
            devices:
              type: integer
            links:
              type: integer
            endpointGroups:
              type: integer
            clusters:
              type: integer

    NtbImport:
      type: object
      required: [file, siteMap, deviceActions, diagramName]
      properties:
        file:
          $ref: '#/components/schemas/NtbFile'
        siteMap:
          type: object
          description: file site ref → target site id
          additionalProperties:
            type: string
            format: uuid
        deviceActions:
          type: object
          description: device ref → what to do when a device of that hostname exists in the target site (default reuse)
          additionalProperties:
            type: string
            enum: [reuse, update, create, skip]
        diagramName:
          type: string
          maxLength: 120

    NtbImportResult:
      type: object
      required: [diagramId, created, reused, warnings]
      properties:
        diagramId:
          type: string
          format: uuid
        created:
          type: object
          required: [devices, links, endpointGroups, clusters]
          properties:
            devices:
              type: integer
            links:
              type: integer
            endpointGroups:
              type: integer
            clusters:
              type: integer
        reused:
          type: integer
          description: devices / groups / clusters already there and used as they are
        warnings:
          type: array
          items:
            type: string

    Dashboard:
      type: object
      required: [generatedAt, totals, bySite, byType, problems, missingInfo, expiring]
      properties:
        generatedAt:
          type: string
          format: date-time
        totals:
          $ref: '#/components/schemas/DashboardTotals'
        bySite:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSite'
        byType:
          type: array
          items:
            $ref: '#/components/schemas/DashboardTypeCount'
        problems:
          type: array
          description: worst first; one row per conflict, counts for the info-level ones
          items:
            $ref: '#/components/schemas/DashboardProblem'
        missingInfo:
          type: array
          description: the first 20
          items:
            $ref: '#/components/schemas/DashboardMissing'
        expiring:
          type: array
          items:
            $ref: '#/components/schemas/DashboardExpiry'

    DashboardTotals:
      type: object
      required: [devices, active, planned, spare, rma, retired, missingInfo, expiring, expired, errors, warnings, subnetsFull]
      properties:
        devices: {type: integer, description: 'devices not retired'}
        active: {type: integer}
        planned: {type: integer}
        spare: {type: integer}
        rma: {type: integer}
        retired: {type: integer}
        missingInfo: {type: integer, description: 'active devices lacking S/N, part number, model or location'}
        expiring: {type: integer, description: 'warranty / end-of-support dates within the next 90 days'}
        expired: {type: integer, description: 'warranty / end-of-support dates already past (devices still in use)'}
        errors: {type: integer}
        warnings: {type: integer}
        subnetsFull: {type: integer, description: IPv4 subnets at least 90 % used}

    DashboardSite:
      type: object
      required: [siteId, code, name, total, active, planned, spare, rma, retired]
      properties:
        siteId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        total: {type: integer}
        active: {type: integer}
        planned: {type: integer}
        spare: {type: integer}
        rma: {type: integer}
        retired: {type: integer}

    DashboardTypeCount:
      type: object
      required: [type, count]
      properties:
        type: {$ref: '#/components/schemas/DeviceType'}
        count: {type: integer}

    DashboardMissing:
      type: object
      required: [id, hostname, siteCode, missing]
      properties:
        id: {type: string, format: uuid}
        hostname: {type: string}
        siteCode: {type: string}
        missing:
          type: array
          items:
            type: string
            enum: [serial, partNumber, model, location]

    DashboardExpiry:
      type: object
      required: [deviceId, hostname, siteCode, kind, date, days]
      properties:
        deviceId: {type: string, format: uuid}
        hostname: {type: string}
        siteCode: {type: string}
        kind:
          type: string
          enum: [warranty, eos]
        date: {type: string, format: date}
        days: {type: integer, description: 'days left (negative = already past)'}

    DashboardProblem:
      type: object
      required: [kind, severity, subject, detail, count]
      properties:
        kind:
          type: string
          enum: [duplicate_ip, duplicate_hostname, duplicate_serial, port_multi_link, subnet_full, no_link, no_mgmt]
        severity:
          type: string
          enum: [error, warning, info]
        subject:
          type: string
          description: the address / hostname / serial / port / subnet concerned (empty for counts)
        detail:
          type: string
          description: holders, devices or usage, ready to show
        count:
          type: integer
        deviceId: {type: string, format: uuid}
        subnetId: {type: string, format: uuid}

    DesignRequest:
      type: object
      required: [scenario, vendor, users]
      properties:
        scenario:
          type: string
          enum: [small, medium, branches]
          description: small office (up to ~50 users), medium office (up to ~100, L3 core), head office + branches
        vendor:
          type: string
          enum: [fortinet_cisco, fortinet_aruba, tplink_omada, ubiquiti]
        users:
          type: integer
          minimum: 5
          maximum: 250
          description: users of the office (of the head office for branches)
        branches:
          type: integer
          minimum: 1
          maximum: 20
        branchUsers:
          type: integer
          minimum: 5
          maximum: 60
        ha:
          type: boolean
          description: firewall HA pair, a second Internet line, core stack (Fortinet profiles only)
        remoteVpn:
          type: boolean
          description: VPN for staff working from outside (client VPN pool)
        phones:
          type: boolean
        cameras:
          type: boolean
        guestWifi:
          type: boolean
        categoryId:
          type: string
          format: uuid
          description: category of the new sites (none = straight under the organization)
        siteNames:
          type: array
          maxItems: 21
          description: names of the new sites, head office first; empty = defaults
          items:
            type: string
            maxLength: 120
        existingSiteId:
          type: string
          format: uuid
          description: small / medium only — draw into this site instead of creating one
        diagramName:
          type: string
          maxLength: 120

    DesignPreview:
      type: object
      required: [devices, groups, subnets, warnings, notes, totals]
      properties:
        notes:
          type: array
          description: advice for the engineer (DHCP relay, ISP modem with an HA pair…), not problems
          items: {type: string}
        devices:
          type: array
          items:
            type: object
            required: [site, role, hostname, model, vendor]
            properties:
              site: {type: string}
              role: {type: string, description: 'firewall, core, access, ap, ont, internet'}
              hostname: {type: string}
              model: {type: string}
              vendor: {type: string}
        groups:
          type: array
          items:
            type: object
            required: [site, name, kind, count]
            properties:
              site: {type: string}
              name: {type: string}
              kind: {$ref: '#/components/schemas/EndpointKind'}
              count: {type: integer}
        subnets:
          type: array
          items:
            type: object
            required: [site, vlan, name, cidr, gateway, dhcp]
            properties:
              site: {type: string}
              vlan: {type: integer, description: '0 = no VLAN (transit, VPN pool)'}
              name: {type: string}
              cidr: {type: string}
              gateway: {type: string}
              dhcp: {type: string, description: 'DHCP / static range, empty when none'}
        warnings:
          type: array
          items: {type: string}
        totals:
          type: object
          required: [devices, cables, sites]
          properties:
            devices: {type: integer}
            cables: {type: integer}
            sites: {type: integer}

    DesignResult:
      type: object
      required: [diagramId, devices, cables, sites, warnings]
      properties:
        warnings:
          type: array
          items: {type: string}
        diagramId: {type: string, format: uuid}
        devices: {type: integer}
        cables: {type: integer}
        sites: {type: integer}

    SiteGraph:
      type: object
      required: [sites, edges]
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/SiteCard'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SiteEdge'

    SiteCard:
      type: object
      required: [id, code, localCode, name, kind, categoryPath, devices, planned, groups, gateway, wan, diagrams, peers]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        localCode: {type: string}
        name: {type: string}
        kind: {$ref: '#/components/schemas/SiteKind'}
        categoryId: {type: string, format: uuid}
        categoryPath: {type: string}
        devices: {type: integer, description: 'devices not retired (provider clouds left out)'}
        planned: {type: integer}
        groups: {type: integer}
        gateway: {type: string, description: 'e.g. "FortiGate 60F ×2 HA"; empty when the site has none'}
        wan:
          type: array
          description: ISP lines of the site (identical lines merged with a count)
          items:
            $ref: '#/components/schemas/SiteWan'
        diagrams:
          type: array
          description: detail diagrams placing devices of the site, most devices first
          items:
            $ref: '#/components/schemas/SearchDiagram'
        peers: {type: integer, description: 'sites this one has links with'}

    SiteWan:
      type: object
      required: [provider, service, bandwidth, count]
      properties:
        provider: {type: string, description: 'the link provider, else the ISP cloud name'}
        service: {$ref: '#/components/schemas/SiteLinkService'}
        bandwidth: {type: string}
        count: {type: integer}

    SiteLinkService:
      type: string
      description: what a link carries (translated by the client)
      enum: [internet_broadband, internet_dedicated, mpls, leased_line, metro, mobile, vpn, wireless, dsl, fiber, ethernet, other]

    SiteEdge:
      type: object
      required: [a, b, links, service, medium, bandwidth, more, style]
      properties:
        a: {type: string, format: uuid}
        b: {type: string, format: uuid}
        links: {type: integer}
        service: {$ref: '#/components/schemas/SiteLinkService'}
        medium: {type: string, description: 'as typed on the links (e.g. "VPN/IPsec"), shown for VPN edges'}
        bandwidth: {type: string}
        more: {type: integer, description: 'links of another service between the two sites'}
        style:
          type: string
          enum: [dedicated, vpn, wireless, other]

    SearchResult:
      type: object
      required: [devices, clusters, ips, macs, groups]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/SearchDeviceHit'
        clusters:
          type: array
          items:
            $ref: '#/components/schemas/SearchClusterHit'
        ips:
          type: array
          items:
            $ref: '#/components/schemas/SearchIPHit'
        macs:
          type: array
          items:
            $ref: '#/components/schemas/SearchMACHit'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SearchGroupHit'

    SearchDeviceHit:
      type: object
      required: [id, hostname, type, siteCode, matched, matchedValue, diagrams]
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        siteCode:
          type: string
        matched:
          type: string
          enum: [hostname, serial, partNumber, model, assetTag]
        matchedValue:
          type: string
        diagrams:
          type: array
          description: diagrams showing the device (to open it there)
          items:
            $ref: '#/components/schemas/SearchDiagram'

    SearchClusterHit:
      type: object
      required: [id, name, kind, hostname, siteCode, diagrams]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ClusterKind'
        hostname:
          type: string
        siteCode:
          type: string
        diagrams:
          type: array
          items:
            $ref: '#/components/schemas/SearchDiagram'

    SearchIPHit:
      type: object
      required: [host, address, role, name, interfaceName, siteCode, diagrams]
      properties:
        host:
          type: string
        address:
          type: string
        role:
          type: string
        deviceId:
          type: string
          format: uuid
        clusterId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        name:
          type: string
          description: device hostname, cluster name or member name
        interfaceName:
          type: string
        siteCode:
          type: string
        diagrams:
          type: array
          items:
            $ref: '#/components/schemas/SearchDiagram'

    SearchMACHit:
      type: object
      required: [mac, name, interfaceName, diagrams]
      properties:
        mac:
          type: string
        deviceId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        name:
          type: string
        interfaceName:
          type: string
        diagrams:
          type: array
          items:
            $ref: '#/components/schemas/SearchDiagram'

    SearchGroupHit:
      type: object
      required: [id, name, kind, siteCode, diagrams]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/EndpointKind'
        siteCode:
          type: string
        diagrams:
          type: array
          items:
            $ref: '#/components/schemas/SearchDiagram'

    SearchDiagram:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ApplyTemplate:
      type: object
      description: an organization template, a system template (catalogId) or port groups typed on the spot — exactly one
      properties:
        catalogId:
          type: string
          maxLength: 100
        templateId:
          type: string
          format: uuid
        ports:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PortGroup'

    ApplyTemplateResult:
      type: object
      required: [added]
      properties:
        added:
          type: integer
          format: int64

    ClusterKind:
      type: string
      enum: [ha_active_passive, ha_active_active, stack, vpc, vss, other]

    ClusterRole:
      type: string
      enum: [primary, secondary, member]

    ClusterInput:
      type: object
      required: [kind, name, siteId]
      properties:
        kind:
          $ref: '#/components/schemas/ClusterKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        hostname:
          type: string
          maxLength: 253
          description: Shared hostname of the cluster (optional)
        mgmtIp:
          type: [string, 'null']
          description: Shared management IP (CIDR), e.g. the HA cluster IP
        notes:
          type: string
          maxLength: 2000
        siteId:
          type: string
          format: uuid
    ClusterUpdate:
      type: object
      required: [kind, name, siteId, version]
      properties:
        kind:
          $ref: '#/components/schemas/ClusterKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        hostname:
          type: string
          maxLength: 253
          description: Shared hostname of the cluster (optional)
        mgmtIp:
          type: [string, 'null']
          description: Shared management IP (CIDR), e.g. the HA cluster IP
        notes:
          type: string
          maxLength: 2000
        siteId:
          type: string
          format: uuid
        version:
          type: integer
          format: int32

    Cluster:
      type: object
      required: [id, kind, name, hostname, mgmtIp, notes, siteId, siteCode, siteName, memberCount, memberHostnames, memberType, access, version, categoryPath]
      properties:
        categoryPath:
          type: string
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ClusterKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        hostname:
          type: string
          maxLength: 253
          description: Shared hostname of the cluster (optional)
        mgmtIp:
          type: [string, 'null']
          description: Shared management IP (CIDR), e.g. the HA cluster IP
        notes:
          type: string
          maxLength: 2000
        siteId:
          type: string
          format: uuid
        siteCode:
          type: string
        siteName:
          type: string
        memberCount:
          type: integer
          format: int64
        memberHostnames:
          type: string
        memberType:
          type: string
          description: Device type of the members ('' when empty) — members share one type (ADR-027)
        access:
          $ref: '#/components/schemas/AccessLevel'
        version:
          type: integer
          format: int32

    ClusterMember:
      type: object
      required: [id, hostname, type, model, serialNumber, role, memberNo, lifecycle]
      properties:
        id:
          type: string
          format: uuid
        hostname:
          type: string
        type:
          $ref: '#/components/schemas/DeviceType'
        model:
          type: string
        serialNumber:
          type: string
        role:
          oneOf:
            - $ref: '#/components/schemas/ClusterRole'
            - type: 'null'
        memberNo:
          type: [integer, 'null']
          format: int32
        lifecycle:
