            $ref: '#/components/schemas/Subnet'

    EndpointKind:
      type: string
      description: The device type of the group's members (used when a member becomes a device)
      enum: [pc, laptop, printer, ip_camera, ip_phone, access_point, access_control, video_conference, iot, server, vm, nas, other]

    EndpointGroupInput:
      type: object
      required: [kind, name, siteId]
      properties:
        kind:
          $ref: '#/components/schemas/EndpointKind'
        name:
          type: string
          maxLength: 100
        siteId:
          type: string
          format: uuid
        ipRangeId:
          type: [string, 'null']
          format: uuid
          description: planned IP range of a subnet of the same site (or organization-wide)
        expectedCount:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 100000
        notes:
          type: string
          maxLength: 2000

    EndpointGroupUpdate:
      allOf:
        - $ref: '#/components/schemas/EndpointGroupInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32

    EndpointGroup:
      type: object
      required: [id, kind, name, siteId, siteCode, siteName, ipRangeId, rangeStart, rangeEnd, rangeKind, rangePurpose, subnetId, subnetCidr, vrf, expectedCount, memberCount, total, notes, access, version, categoryPath]
      properties:
        categoryPath:
          type: string
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/EndpointKind'
        name:
          type: string
        siteId:
          type: string
          format: uuid
        siteCode:
          type: string
        siteName:
          type: string
        ipRangeId:
          type: [string, 'null']
          format: uuid
        rangeStart:
          type: [string, 'null']
        rangeEnd:
          type: [string, 'null']
        rangeKind:
          type: string
          description: dhcp | static | reserved, empty without a range
        rangePurpose:
          type: string
        subnetId:
          type: [string, 'null']
          format: uuid
        subnetCidr:
          type: [string, 'null']
        vrf:
          type: string
        expectedCount:
          type: [integer, 'null']
          format: int32
        memberCount:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
          description: the "used / total" badge total — expected count, else the range size, else the member count
        notes:
          type: string
        access:
          $ref: '#/components/schemas/AccessLevel'
        version:
          type: integer
          format: int32

    EndpointGroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/EndpointGroup'

    EndpointMemberInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        ip:
          type: [string, 'null']
          description: a single address, e.g. 10.72.120.15 (inside the group's range when it has one)
        mac:
          type: [string, 'null']
        interfaceId:
          type: [string, 'null']
          format: uuid
          description: the physical switch port the member plugs into (a device of the same site)
        notes:
          type: string
          maxLength: 500

    EndpointMemberUpdate:
      allOf:
        - $ref: '#/components/schemas/EndpointMemberInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32

    EndpointMember:
      type: object
      required: [id, name, ip, address, mac, interfaceId, interfaceName, portDeviceId, portHostname, notes, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ip:
          type: [string, 'null']
        address:
          type: [string, 'null']
          description: the IP with the subnet's prefix length when the group has a range
        mac:
          type: [string, 'null']
        interfaceId:
          type: [string, 'null']
          format: uuid
        interfaceName:
          type: string
        portDeviceId:
          type: [string, 'null']
          format: uuid
        portHostname:
          type: string
        notes:
          type: string
        version:
          type: integer
          format: int32

    EndpointGroupDetail:
      allOf:
        - $ref: '#/components/schemas/EndpointGroup'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/EndpointMember'

    PromoteMemberInput:
      type: object
