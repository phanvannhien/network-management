openapi: 3.1.0
info:
  title: Network Topology Builder API
  version: 0.1.0
  description: Contract between frontend and backend (ADR-017). Edit this file first, then run `make gen`.
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness + database check
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        database:
          type: string
          enum: [ok, unavailable]
