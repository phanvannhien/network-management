          description: the new device's hostname; defaults to the member name

    LinkEndKind:
      type: string
      enum: [device, endpoint_group]

    LinkKind:
      type: string
      description: >-
        ADR-033. ethernet (copper incl. DAC), fiber (incl. AOC), wireless, serial, console, power (UPS/PDU → device),
        stack (stacking / HA heartbeat), dsl (DSL, coax), cellular (4G/5G, satellite) are physical; logical (VPN/IPsec,
        GRE) uses virtual interfaces or no port. A LAG is drawn as its member cables; MPLS is a WAN `service`.
      enum: [ethernet, fiber, wireless, serial, console, power, stack, dsl, cellular, logical]

    LinkFiberMode:
      type: string
      description: single-mode / multi-mode (fiber links only)
      enum: ['', sm, mm]

    LinkConnector:
      type: string
      description: fiber connector (fiber links only)
      enum: ['', LC, SC, MPO, ST]

    LinkService:
      type: string
      description: >-
        WAN service carried by the link (ADR-033): internet_broadband (FTTH / xDSL, shared), internet_dedicated (dedicated
        Internet with static IP and SLA), mpls (MPLS VPN), leased_line (point-to-point leased circuit), metro (Metro
        Ethernet), mobile (4G/5G SIM), other
      enum: ['', internet_broadband, internet_dedicated, mpls, leased_line, metro, mobile, other]

    LinkStatus:
      type: string
      description: design status (live state comes from monitoring in Phase 3)
      enum: [planned, up, down]

    LinkEndInput:
      type: object
      required: [kind, id]
      properties:
        kind:
          $ref: '#/components/schemas/LinkEndKind'
        id:
          type: string
          format: uuid
        interfaceId:
          type: [string, 'null']
          format: uuid
          description: a port of the device; empty while not known (logical drawing), always empty for a group

    LinkEnd:
      type: object
      required: [kind, id, name, type, siteId, siteCode, interfaceId, interfaceName, interfaceKind, interfaceMedia]
      properties:
        kind:
          $ref: '#/components/schemas/LinkEndKind'
        id:
          type: string
          format: uuid
        name:
          type: string
          description: device hostname or group name
        type:
          type: string
          description: device type, or the group's device type
        siteId:
          type: string
          format: uuid
        siteCode:
          type: string
        interfaceId:
          type: [string, 'null']
          format: uuid
        interfaceName:
          type: string
        interfaceKind:
          type: string
        interfaceMedia:
          type: string

    LinkInput:
      type: object
      required: [a, b, kind]
      properties:
        a:
          $ref: '#/components/schemas/LinkEndInput'
        b:
          $ref: '#/components/schemas/LinkEndInput'
        kind:
          $ref: '#/components/schemas/LinkKind'
        medium:
          type: string
          maxLength: 40
          description: variant, e.g. Cat6, DAC, OM4, VPN/IPsec
        speed:
          type: string
          maxLength: 20
        lengthM:
          type: [number, 'null']
          description: cable length in metres
        cableId:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/LinkStatus'
        fiberMode:
          $ref: '#/components/schemas/LinkFiberMode'
        connector:
          $ref: '#/components/schemas/LinkConnector'
        service:
          $ref: '#/components/schemas/LinkService'
        provider:
          type: string
          maxLength: 100
          description: WAN provider (vendors module in Phase 2)
        circuitId:
          type: string
          maxLength: 100
        bandwidth:
          type: string
          maxLength: 40
        notes:
          type: string
          maxLength: 2000

    LinkUpdate:
      allOf:
        - $ref: '#/components/schemas/LinkInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32

    Link:
      type: object
      required: [id, a, b, kind, medium, speed, lengthM, cableId, status, fiberMode, connector, service, provider, circuitId,
                 bandwidth, notes, access, version]
      properties:
        id:
          type: string
          format: uuid
        a:
          $ref: '#/components/schemas/LinkEnd'
        b:
          $ref: '#/components/schemas/LinkEnd'
        kind:
          $ref: '#/components/schemas/LinkKind'
        medium:
          type: string
        speed:
          type: string
        lengthM:
          type: [number, 'null']
        cableId:
          type: string
        status:
          $ref: '#/components/schemas/LinkStatus'
        fiberMode:
          $ref: '#/components/schemas/LinkFiberMode'
        connector:
          $ref: '#/components/schemas/LinkConnector'
        service:
          $ref: '#/components/schemas/LinkService'
        provider:
          type: string
        circuitId:
          type: string
        bandwidth:
          type: string
        notes:
          type: string
        access:
          $ref: '#/components/schemas/AccessLevel'
        version:
          type: integer
          format: int32

    LinkList:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

