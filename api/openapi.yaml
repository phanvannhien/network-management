      type: object
      required: [detail, idMap]
      properties:
        detail:
          $ref: '#/components/schemas/DiagramDetail'
        idMap:
          type: object
          description: tempId → real id of the objects created by this save
          additionalProperties:
            type: string
            format: uuid

    IpAssignment:
      type: object
      description: >-
        An address in use: on a device interface, the management IP of a device cluster (clusterId set, VRF
        empty), or an endpoint group member (endpointGroupId set, VRF of the group's subnet).
      required: [address, host, role, vrf, deviceId, clusterId, endpointGroupId, hostname, interfaceName]
      properties:
        address:
          type: string
        host:
          type: string
        role:
          $ref: '#/components/schemas/IpRole'
        vrf:
          type: string
        deviceId:
          type: [string, 'null']
          format: uuid
        clusterId:
          type: [string, 'null']
          format: uuid
        endpointGroupId:
          type: [string, 'null']
          format: uuid
        hostname:
          type: string
          description: >-
            device hostname, the cluster hostname (its name when no hostname is set), or the endpoint member name
            (interfaceName then holds the group name)
        interfaceName:
          type: string

    SubnetDetail:
      allOf:
