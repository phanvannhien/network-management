        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
