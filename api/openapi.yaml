      properties:
        id: {type: string, format: uuid}
        deviceId: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string}
        media: {type: string}
        speed: {type: string}
        mode: {type: string}
        accessVlan: {type: [integer, 'null'], format: int32}
        nativeVlan: {type: [integer, 'null'], format: int32}
        allowedVlans: {type: string}
        lagId: {type: [string, 'null'], format: uuid}

    ValIp:
