        interfaceId: {type: [string, 'null'], format: uuid}
        address: {type: string}
        vrf: {type: string}
        role: {type: string}

    ValLink:
      type: object
      required: [id, kind, aKind, aId, aInterfaceId, bKind, bId, bInterfaceId]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        aKind: {type: string}
        aId: {type: string, format: uuid}
        aInterfaceId: {type: [string, 'null'], format: uuid}
        bKind: {type: string}
        bId: {type: string, format: uuid}
        bInterfaceId: {type: [string, 'null'], format: uuid}

    ValSubnet:
      type: object
