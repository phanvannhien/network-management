components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ntb_session

  parameters:

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization (tenant) the request is scoped to (ADR-023)
      schema:
        type: string
        format: uuid

    AuditPageNumber:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1

    DeviceQuery:
      name: q
      in: query
      description: Substring of hostname, serial, part number, model or asset tag
      schema:
        type: string
        maxLength: 200

    DeviceCategoryFilter:
      name: categoryId
      in: query
      description: devices of sites in this category or below it
      schema:
        type: string
        format: uuid

    DeviceSiteFilter:
      name: siteId
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid

    DeviceTypeFilter:
      name: type
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/DeviceType'

    DeviceVendorFilter:
      name: vendor
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          type: string

    DeviceLifecycleFilter:
      name: lifecycle
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/DeviceLifecycle'

    DeviceRoleFilter:
      name: role
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/DeviceRole'

    DeviceTagFilter:
      name: tag
      in: query
      description: Devices carrying any of the tags
      schema:
        type: array
        maxItems: 100
        items:
          type: string

    DeviceSupportFilter:
      name: support
      in: query
      description: Vendor end-of-support (P2-22) — expired before today and / or ending within the next 12 months
      schema:
        type: array
        maxItems: 2
        items:
          type: string
          enum: [expired, soon]
    DeviceClusterFilter:
      name: clusterId
      in: query
      description: Devices in any of the clusters
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid

    DeviceSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [hostname, mgmtIp, type, vendor, model, serial, site, category, lifecycle, warrantyEnd]
        default: hostname

    DeviceSortDesc:
      name: desc
      in: query
      schema:
        type: boolean
        default: false

    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InterfaceId:
      name: interfaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IpId:
      name: ipId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ClusterId:
      name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DiagramId:
      name: diagramId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VlanId:
      name: vlanId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SubnetId:
      name: subnetId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RangeId:
      name: rangeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AuditPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

    AuditQuery:
      name: q
      in: query
      description: Case-insensitive text in action, object id or actor email
      schema:
        type: string
        maxLength: 200

    AuditCategory:
      name: category
      in: query
      description: Action prefix before the dot (auth, mfa, member, organization, user, …); repeatable
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          pattern: '^[a-z_]{1,40}$'

    AuditActor:
      name: actorId
      in: query
      schema:
        type: string
        format: uuid

    AuditFrom:
      name: from
      in: query
      description: Inclusive lower bound on the event time
      schema:
        type: string
        format: date-time

    AuditTo:
      name: to
      in: query
      description: Exclusive upper bound on the event time
      schema:
        type: string
        format: date-time

    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    RackId:
      name: rackId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string

  responses:

    NotFound:
      description: Not found (also returned for organizations the caller does not belong to)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Signed in but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Not signed in, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Conflicts with the current state (stale version, duplicate name, non-empty container, MFA state)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InvalidCode:
      description: The code is wrong, expired or already used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    Health:
      type: object
      required: [status, version, environment, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        environment:
          description: Deployment name from NTB_ENV (production, staging, development…); the UI badges non-production
          type: string
        database:
          type: string
          enum: [ok, unavailable]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024

    CurrentUser:
      type: object
      required: [id, email, displayName, isSystemAdmin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        isSystemAdmin:
          type: boolean

    AuthSession:
      type: object
      required: [user, csrfToken, mfa, activeOrganizationId, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
        mfa:
          $ref: '#/components/schemas/MfaStatus'
        activeOrganizationId:
          description: Organization used last (UI default only; access is checked per request)
          type: [string, 'null']
          format: uuid
        expiresAt:
          description: When the session ends if idle (sliding, capped by the 7-day absolute limit)
          type: string
          format: date-time

    MfaStatus:
      type: object
      description: |
        enabled = TOTP enrolled; verified = code entered this session; required = mandatory for this
        account (system admin / org owner / org admin). The session is fully usable only when
        (enabled and verified) or (not enabled and not required).
      required: [enabled, verified, required]
      properties:
        enabled:
          type: boolean
        verified:
          type: boolean
        required:
          type: boolean
        verifiedAt:
          description: When MFA was last entered in this session (re-verify gates, e.g. secret reveal, use it)
          type: [string, 'null']
          format: date-time

    MfaSetup:
      type: object
      required: [secret, otpauthUrl, qrCode]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry
        otpauthUrl:
          type: string
        qrCode:
          type: string
          description: PNG data URL of the otpauth QR code

    MfaCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    MfaVerifyRequest:
      type: object
      description: Provide either a TOTP code or a recovery code.
      properties:
        code:
          type: string
          maxLength: 16
        recoveryCode:
          type: string
          maxLength: 32

    MfaRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    OrganizationKind:
      type: string
      enum: [internal, customer]

    Role:
      type: string
      description: organization role; it decides everything a member may do in the organization (ADR-032)
      enum: [owner, admin, editor, viewer]

    AccessLevel:
      type: string
      description: The caller's access on a record, from the organization role — view, edit (data), admin (manage users, delete)
      enum: [view, edit, admin]

    OrganizationSummary:
      type: object
      required: [id, name, kind, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        role:
          $ref: '#/components/schemas/Role'

    MyOrganizations:
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummary'

    Organization:
      type: object
      required: [id, name, kind, notes, version, createdAt, updatedAt, code]
      properties:
        code:
          type: string
          description: prefix of every site code (A-Z, 0-9, 2-12, starting with a letter)
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MembershipInfo:
      type: object
      required: [role, permissions]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string

    OrganizationView:
      type: object
      required: [organization, membership]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        membership:
          $ref: '#/components/schemas/MembershipInfo'

    UpdateOrganizationRequest:
      type: object
      required: [name, notes, version, code]
      properties:
        code:
          type: string
          maxLength: 12
        confirmSiteCodes:
          type: boolean
          description: required when the new code changes site codes (preview first)
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 2000
        version:
          type: integer
          format: int32
          description: Version the client last saw; mismatch → 409

    AdminOrganization:
      type: object
      required: [id, name, kind, notes, memberCount, siteCount, createdAt, version, code, categoryCount]
      properties:
        code:
          type: string
        categoryCount:
          type: integer
          format: int64
          description: Categories (count only)
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
        memberCount:
          type: integer
          format: int64
        siteCount:
          type: integer
          format: int64
          description: Live sites (count only)
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32

    AdminOrganizationList:
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganization'

    CreateOrganizationRequest:
      type: object
      required: [name, kind]
      properties:
        code:
          type: string
          maxLength: 12
          description: defaults to the name's letters
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
          maxLength: 2000
        addMeAsOwner:
          type: boolean
          default: true
          description: Make the creating system admin an owner (otherwise nobody can access it until P1-04 adds members)

    Permission:
      type: string
      enum: [credential.reveal, credential.manage, user.manage]

    Member:
      type: object
      required: [userId, email, displayName, role, permissions, mfaEnabled, disabled, pendingInvite, version]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        mfaEnabled:
          type: boolean
        disabled:
          type: boolean
        pendingInvite:
          type: boolean
          description: Invited but has not set a password yet
        version:
          type: integer
          format: int32

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    AddMemberResult:
      type: object
      required: [member, inviteToken]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        inviteToken:
          description: One-time invite token for a new user (build the link /invite/{token}); null for existing users
          type: [string, 'null']

    UpdateMemberRequest:
      type: object
      required: [role, permissions, version]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        version:
          type: integer
          format: int32

    InviteLink:
      type: object
      required: [inviteToken]
      properties:
        inviteToken:
          type: string

    PasswordResetLink:
      type: object
      required: [resetToken]
      properties:
        resetToken:
          type: string
          description: One-time token (build the link /invite/{token})

    AccountTokenInfo:
      type: object
      required: [email, purpose, organizations]
      properties:
        email:
          type: string
        purpose:
          type: string
          enum: [invite, password_reset]
        organizations:
          type: array
          items:
            type: string

    AcceptAccountTokenRequest:
      type: object
      required: [password]
      properties:
        displayName:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 1024

    AuditActorRef:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string

    AuditEntry:
      type: object
      description: One append-only audit record. before/after never contain secrets.
      required: [id, createdAt, actor, action, objectType, objectId, before, after, ip, userAgent, requestId]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        actor:
          oneOf:
            - $ref: '#/components/schemas/AuditActorRef'
            - type: 'null'
        action:
          type: string
        objectType:
          type: string
        objectId:
          type: string
        before:
          description: Snapshot before the change (null when not applicable)
        after:
          description: Snapshot after the change (null when not applicable)
        ip:
          type: string
        userAgent:
          type: string
        requestId:
          type: string

    AuditPage:
      type: object
      required: [entries, total, page, pageSize]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32

    CategoryInput:
      type: object
      required: [name, code]
      properties:
        parentId:
          type: [string, 'null']
          format: uuid
          description: parent category; null = straight under the organization
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 12
          description: A-Z, 0-9, 2-12, starting with a letter; unique among siblings; part of site codes
        contactName:
          type: string
          maxLength: 200
        contactPhone:
          type: string
          maxLength: 50
        contactEmail:
          type: string
          maxLength: 320
        notes:
          type: string
          maxLength: 2000

    CategoryUpdate:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32
            confirmSiteCodes:
              type: boolean
              description: required when the update changes site codes

    Category:
      type: object
      required: [id, parentId, name, code, path, contactName, contactPhone, contactEmail, notes, childCount, siteCount, version]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        code:
          type: string
        path:
          type: string
          description: names from the root, e.g. "CJ Feed › Nhà máy Deheus"
        contactName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        notes:
          type: string
        childCount:
          type: integer
          format: int64
        siteCount:
          type: integer
          format: int64
          description: sites directly in this category
        version:
          type: integer
          format: int32

    CategoryList:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    SiteCodeChanges:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [siteId, name, from, to]
            properties:
              siteId:
                type: string
                format: uuid
              name:
                type: string
              from:
                type: string
              to:
                type: string

    SiteCodeSuggestion:
      type: object
      required: [code]
      properties:
        code:
          type: string

    SiteKind:
      type: string
      enum: [office, factory, datacenter, warehouse, store, other]

    SiteInput:
      type: object
      required: [code, name]
      properties:
        categoryId:
          type: [string, 'null']
          format: uuid
          description: the category the site belongs to; null = straight under the organization (ADR-032)
        code:
          type: string
          maxLength: 12
          description: "The site's own code (A-Z, 0-9, up to 12), e.g. HCM or BD01; the full code is derived from the category path (ADR-032)"
        kind:
          $ref: '#/components/schemas/SiteKind'
        isp:
          type: string
          maxLength: 200
        name:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 500
        timezone:
          type: string
          description: IANA time zone (default Asia/Ho_Chi_Minh)
        contactName:
          type: string
          maxLength: 200
        contactPhone:
          type: string
          maxLength: 50
        contactEmail:
          type: string
          maxLength: 320
        notes:
          type: string
          maxLength: 2000

    SiteUpdate:
      allOf:
        - $ref: '#/components/schemas/SiteInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32

    Site:
      type: object
      required: [id, code, name, kind, isp, address, timezone, contactName, contactPhone, contactEmail, notes, locationCount, rackCount, version, createdAt, updatedAt, access, localCode, categoryId, categoryPath]
      properties:
        categoryId:
          type: [string, 'null']
          format: uuid
          description: the site's category (null = attached straight to the organization)
        categoryPath:
          type: string
          description: category names from the root, e.g. "CJ Feed › Nhà máy Deheus" (empty at the organization level)
        localCode:
          type: string
          description: the site's own part of the code
        access:
          $ref: '#/components/schemas/AccessLevel'
        id:
          type: string
          format: uuid
        code:
          type: string
        kind:
          $ref: '#/components/schemas/SiteKind'
        isp:
          type: string
        name:
          type: string
        address:
          type: string
        timezone:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        notes:
          type: string
        locationCount:
          type: integer
          format: int64
        rackCount:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteList:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'

    LocationKind:
      type: string
      enum: [building, floor, room]

    LocationInput:
      type: object
      required: [kind, name]
      properties:
        parentId:
          type: [string, 'null']
          format: uuid
        kind:
          $ref: '#/components/schemas/LocationKind'
        name:
          type: string
          maxLength: 100
        sortOrder:
          type: integer
          format: int32

    LocationUpdate:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          maxLength: 100
        sortOrder:
          type: integer
          format: int32
        version:
          type: integer
          format: int32

    Location:
      type: object
      required: [id, parentId, kind, name, sortOrder, version]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        kind:
          $ref: '#/components/schemas/LocationKind'
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        version:
          type: integer
          format: int32

    LocationList:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'

    RackInput:
      type: object
      required: [locationId, name]
      properties:
        locationId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        uHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        notes:
          type: string
          maxLength: 2000

    RackUpdate:
      allOf:
        - $ref: '#/components/schemas/RackInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32

    Rack:
      type: object
      required: [id, locationId, name, uHeight, notes, version]
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        name:
          type: string
        uHeight:
          type: integer
          format: int32
        notes:
          type: string
        version:
          type: integer
          format: int32

    RackList:
      type: object
      required: [racks]
      properties:
        racks:
          type: array
          items:
            $ref: '#/components/schemas/Rack'

    AdminUser:
      type: object
      required: [id, email, displayName, isSystemAdmin, mfaEnabled, disabled, pendingInvite, organizationCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        isSystemAdmin:
          type: boolean
        mfaEnabled:
          type: boolean
        disabled:
          type: boolean
        pendingInvite:
          type: boolean
        organizationCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'

    DeviceType:
      type: string
      enum: [router, l3_switch, l2_switch, poe_switch, firewall, load_balancer, wireless_controller, access_point, vpn_gateway, ids_ips, waf, nac, proxy, media_converter, patch_panel, modem, ont, olt, provider_cloud, wireless_bridge, console_server, sdwan_edge, server, vm, nas, pc, laptop, printer, ip_camera, nvr, ip_phone, pbx, access_control, video_conference, iot, ups, pdu, other]

    DeviceRole:
      type: string
      enum: [none, core, distribution, access, edge, dmz, oob]

    DeviceLifecycle:
      type: string
      enum: [planned, active, spare, rma, retired]

    DeviceInput:
      type: object
      required: [hostname, type, siteId]
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        type:
          $ref: '#/components/schemas/DeviceType'
        vendor:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        partNumber:
          type: string
          maxLength: 100
        serialNumber:
          type: string
          maxLength: 100
        assetTag:
          type: string
          maxLength: 100
        firmware:
          type: string
          maxLength: 100
        role:
          $ref: '#/components/schemas/DeviceRole'
        lifecycle:
          $ref: '#/components/schemas/DeviceLifecycle'
        managed:
          type: boolean
          description: false = belongs to someone else (e.g. the ISP's modem)
        ownerName:
          type: string
          maxLength: 200
          description: Person in charge
        poNumber:
          type: string
          maxLength: 100
        purchaseDate:
          type: [string, 'null']
          format: date
        warrantyEnd:
          type: [string, 'null']
          format: date
        licenseEnd:
          type: [string, 'null']
          format: date
        eolDate:
          type: [string, 'null']
          format: date
        eosDate:
          type: [string, 'null']
          format: date
        notes:
          type: string
          maxLength: 4000
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 50
        customFields:
          type: object
          additionalProperties: true
          description: Values by custom field key (string, number, boolean or ISO date)
        siteId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        rackId:
          type: [string, 'null']
          format: uuid
        rackU:
          type: [integer, 'null']
          format: int32
          minimum: 1
          maximum: 60
          description: Lowest U the device occupies
        uHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        mgmtInterfaceId:
          type: [string, 'null']
          format: uuid
          description: Management interface (ADR-012); the management IP is its primary IP. Ignored on create.
        pollAddress:
          type: [string, 'null']
          description: Address the poller uses (Phase 3); null = the management IP
        clusterId:
          type: [string, 'null']
          format: uuid
          description: Cluster of the device (same site, ADR-027)
        clusterRole:
          oneOf:
            - $ref: '#/components/schemas/ClusterRole'
            - type: 'null'
        clusterMemberNo:
          type: [integer, 'null']
          format: int32
          minimum: 1
          maximum: 99
        templateId:
          type: [string, 'null']
          format: uuid
          description: Create only — fill empty type/vendor/model/part number from the template and generate its ports
        catalogId:
          type: string
          maxLength: 100
          description: Create only — a system template (built-in catalog, ADR-035) instead of an organization template

    DeviceUpdate:
      allOf:
        - $ref: '#/components/schemas/DeviceInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32

    Device:
      type: object
      required: [id, hostname, type, vendor, model, partNumber, serialNumber, assetTag, firmware, role, lifecycle, managed, ownerName, poNumber, purchaseDate, warrantyEnd, licenseEnd, eolDate, eosDate, notes, tags, customFields, siteId, siteCode, siteName, locationId, locationName, rackId, rackName, rackU, uHeight, mgmtInterfaceId, mgmtInterfaceName, mgmtIp, pollAddress, clusterId, clusterName, clusterKind, clusterRole, clusterMemberNo, access, version, createdAt, updatedAt, categoryId, categoryPath, templateId, catalogId]
      properties:
        templateId:
          type: [string, 'null']
          format: uuid
          description: Template the device was created from (its ports came from it); used when cloning
        catalogId:
          type: string
          description: system template (built-in catalog) the device was created from; empty when none
        categoryId:
          type: [string, 'null']
          format: uuid
          description: the site's category (null = attached straight to the organization)
        categoryPath:
          type: string
          description: category names from the root, e.g. "CJ Feed › Nhà máy Deheus" (empty at the organization level)
        id:
          type: string
          format: uuid
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        type:
          $ref: '#/components/schemas/DeviceType'
        vendor:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        partNumber:
          type: string
          maxLength: 100
        serialNumber:
          type: string
          maxLength: 100
        assetTag:
          type: string
          maxLength: 100
        firmware:
          type: string
          maxLength: 100
        role:
          $ref: '#/components/schemas/DeviceRole'
        lifecycle:
          $ref: '#/components/schemas/DeviceLifecycle'
        managed:
          type: boolean
          description: false = belongs to someone else (e.g. the ISP's modem)
        ownerName:
          type: string
          maxLength: 200
          description: Person in charge
        poNumber:
          type: string
          maxLength: 100
        purchaseDate:
          type: [string, 'null']
          format: date
        warrantyEnd:
          type: [string, 'null']
          format: date
        licenseEnd:
          type: [string, 'null']
          format: date
        eolDate:
          type: [string, 'null']
          format: date
        eosDate:
          type: [string, 'null']
          format: date
        notes:
          type: string
          maxLength: 4000
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 50
        customFields:
          type: object
          additionalProperties: true
          description: Values by custom field key (string, number, boolean or ISO date)
        siteId:
          type: string
          format: uuid
        locationId:
          type: [string, 'null']
          format: uuid
        rackId:
          type: [string, 'null']
          format: uuid
        rackU:
          type: [integer, 'null']
          format: int32
          minimum: 1
          maximum: 60
          description: Lowest U the device occupies
        uHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        mgmtInterfaceId:
          type: [string, 'null']
          format: uuid
          description: Management interface (ADR-012); the management IP is its primary IP. Ignored on create.
        pollAddress:
          type: [string, 'null']
          description: Address the poller uses (Phase 3); null = the management IP
        clusterId:
          type: [string, 'null']
          format: uuid
          description: Cluster of the device (same site, ADR-027)
        clusterRole:
          oneOf:
            - $ref: '#/components/schemas/ClusterRole'
            - type: 'null'
        clusterMemberNo:
          type: [integer, 'null']
          format: int32
          minimum: 1
          maximum: 99
        clusterName:
          type: string
        clusterKind:
          type: string
        mgmtInterfaceName:
          type: string
        mgmtIp:
          type: string
          description: Primary IP (CIDR) of the management interface, '' when none
        siteCode:
          type: string
        siteName:
          type: string
        locationName:
          type: string
        rackName:
          type: string
        access:
          $ref: '#/components/schemas/AccessLevel'
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeviceList:
      type: object
      required: [devices, total, facets]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        total:
          type: integer
          format: int64
        facets:
          type: object
          description: Per facet (site, type, vendor, lifecycle, role, tag, cluster) the count of each value, filtered by every other facet
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
              format: int64

    DeviceIds:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid

    DeviceDeleteImpact:
      type: object
      required: [devices, links, diagrams]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceImpact'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        diagrams:
          type: array
          items:
            $ref: '#/components/schemas/DiagramShowing'

    DeviceImport:
      type: object
      required: [dryRun, matchBy, clusters, rows]
      properties:
        dryRun:
          type: boolean
        matchBy:
          type: string
          enum: [none, hostname, serial]
          description: none = create only (an existing hostname is an error); hostname / serial = update the device found
        clusters:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DeviceImportCluster'
        rows:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DeviceImportRow'

    DeviceImportCluster:
      type: object
      required: [key, kind, name, siteId]
      properties:
        key:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/ClusterKind'
        name:
          type: string
          maxLength: 100
        hostname:
          type: string
          maxLength: 253
        mgmtIp:
          type: string
          maxLength: 50
          description: the shared address (VIP); without a prefix length the IPAM subnet holding it gives one
        siteId:
          type: string
          format: uuid

    DeviceImportRow:
      type: object
      required: [row, device]
      properties:
        row:
          type: integer
          description: spreadsheet row number, echoed in the result
        device:
          $ref: '#/components/schemas/DeviceInput'
        clusterKey:
          type: string
          maxLength: 100
          description: member of the cluster with this key in the same request (role / member no. from device)
        mgmtIp:
          type: string
          maxLength: 50
          description: >-
            management address; without a prefix length the IPAM subnet holding it gives one, else /32. Ignored for
            cluster members (the cluster carries it).
        mgmtInterface:
          type: string
          maxLength: 100
          description: interface to hold the address (a template port name, or created); empty = Vlan1 for switches, mgmt otherwise

    DeviceImportResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DeviceImportRowResult'

    DeviceImportRowResult:
      type: object
      required: [row, action, hostname, message, warnings]
      properties:
        row:
          type: integer
        action:
          type: string
          enum: [create, update, error]
        deviceId:
          type: string
          format: uuid
        hostname:
          type: string
        message:
          type: string
          description: why the row was refused (action error)
        warnings:
          type: array
          items:
            type: string

    ValidationRequest:
      type: object
      required: [deviceIds, groupIds]
      properties:
        deviceIds:
          type: array
          maxItems: 5000
          items:
            type: string
            format: uuid
        groupIds:
          type: array
          maxItems: 5000
          items:
            type: string
            format: uuid
        interfaceIds:
          type: array
          maxItems: 5000
          description: ports used by unsaved cables — returned even when nothing else would include them
          items:
            type: string
            format: uuid

    ValidationContext:
      type: object
      required: [devices, interfaces, ips, links, subnets, groups, conflicts]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/ValDevice'
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/ValInterface'
        ips:
          type: array
          items:
            $ref: '#/components/schemas/ValIp'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ValLink'
        subnets:
          type: array
          items:
            $ref: '#/components/schemas/ValSubnet'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ValGroup'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ValConflict'

    ValDevice:
      type: object
      required: [id, hostname, type, serialNumber, model, firmware, lifecycle, clusterId, siteId, locationId, mgmtInterfaceId]
      properties:
        id: {type: string, format: uuid}
        hostname: {type: string}
        type: {type: string}
        serialNumber: {type: string}
        model: {type: string}
        firmware: {type: string}
        lifecycle: {type: string}
        clusterId: {type: [string, 'null'], format: uuid}
        siteId: {type: string, format: uuid}
        locationId: {type: [string, 'null'], format: uuid}
        mgmtInterfaceId: {type: [string, 'null'], format: uuid}

    ValInterface:
