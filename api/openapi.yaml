openapi: 3.1.0
info:
  title: Network Topology Builder API
  version: 0.1.0
  description: |
    Contract between frontend and backend (ADR-017). Edit this file first, then run `make gen`.

    Authentication: session cookie `ntb_session` (HttpOnly, SameSite=Lax) set by POST /auth/login.
    Every state-changing request except login must send header `X-CSRF-Token` with the token
    returned by /auth/login or /auth/me.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness + database check
      security: []
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and clear the session cookie
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentSession
      summary: Current user and CSRF token
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/mfa/setup:
    post:
      operationId: setupMfa
      summary: Start TOTP enrollment (returns the secret and a QR code once)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Enrollment started; confirm with /auth/mfa/enable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/enable:
    post:
      operationId: enableMfa
      summary: Confirm enrollment with a code; returns one-time recovery codes
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '200':
          description: MFA enabled; recovery codes are shown only now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodes'
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Complete sign-in with a TOTP code or a recovery code
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Session is now MFA-verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Too many attempts; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/mfa/disable:
    post:
      operationId: disableMfa
      summary: Turn off MFA (not allowed when MFA is mandatory for the account)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '204':
          description: MFA disabled
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: MFA is mandatory for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ntb_session

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Not signed in, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with the current MFA state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCode:
      description: The code is wrong, expired or already used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        database:
          type: string
          enum: [ok, unavailable]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024

    CurrentUser:
      type: object
      required: [id, email, displayName, isSystemAdmin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        isSystemAdmin:
          type: boolean

    AuthSession:
      type: object
      required: [user, csrfToken, mfa]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
        mfa:
          $ref: '#/components/schemas/MfaStatus'

    MfaStatus:
      type: object
      description: |
        enabled = TOTP enrolled; verified = code entered this session; required = mandatory for this
        account (system admin / org owner / org admin). The session is fully usable only when
        (enabled and verified) or (not enabled and not required).
      required: [enabled, verified, required]
      properties:
        enabled:
          type: boolean
        verified:
          type: boolean
        required:
          type: boolean

    MfaSetup:
      type: object
      required: [secret, otpauthUrl, qrCode]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry
        otpauthUrl:
          type: string
        qrCode:
          type: string
          description: PNG data URL of the otpauth QR code

    MfaCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    MfaVerifyRequest:
      type: object
      description: Provide either a TOTP code or a recovery code.
      properties:
        code:
          type: string
          maxLength: 16
        recoveryCode:
          type: string
          maxLength: 32

    MfaRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
