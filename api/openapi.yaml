      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagramMetaUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
