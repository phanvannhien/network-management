openapi: 3.1.0
info:
  title: Network Topology Builder API
  version: 0.1.0
  description: |
    Contract between frontend and backend (ADR-017). Edit this file first, then run `make gen`.

    Authentication: session cookie `ntb_session` (HttpOnly, SameSite=Lax) set by POST /auth/login.
    Every state-changing request except login must send header `X-CSRF-Token` with the token
    returned by /auth/login or /auth/me.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness + database check
      security: []
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and clear the session cookie
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentSession
      summary: Current user and CSRF token
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/mfa/setup:
    post:
      operationId: setupMfa
      summary: Start TOTP enrollment (returns the secret and a QR code once)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Enrollment started; confirm with /auth/mfa/enable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/enable:
    post:
      operationId: enableMfa
      summary: Confirm enrollment with a code; returns one-time recovery codes
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '200':
          description: MFA enabled; recovery codes are shown only now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodes'
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Complete sign-in with a TOTP code or a recovery code
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Session is now MFA-verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Too many attempts; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/mfa/disable:
    post:
      operationId: disableMfa
      summary: Turn off MFA (not allowed when MFA is mandatory for the account)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '204':
          description: MFA disabled
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: MFA is mandatory for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs:
    get:
      operationId: listMyOrganizations
      summary: Organizations the current user belongs to
      responses:
        '200':
          description: Memberships, sorted by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganizations'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getOrganization
      summary: Organization details and the caller's membership
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOrganization
      summary: Rename / edit notes (owner, admin). Optimistic lock on version.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/activate:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: activateOrganization
      summary: Remember this organization as the default to open after sign-in
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Saved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations:
    get:
      operationId: adminListOrganizations
      summary: All organizations (system admin)
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: adminCreateOrganization
      summary: Create an organization (system admin)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/organizations/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    delete:
      operationId: adminDeleteOrganization
      summary: Soft-delete an organization (system admin, ADR-022)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted (hidden everywhere; history kept)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listMembers
      summary: Members of the organization (not for grant-only members)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addMember
      summary: Add a member by email (owner/admin/user.manage); unknown emails get a one-time invite link
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddMemberResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateMember
      summary: Change role / extra permissions (optimistic lock on version)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMember
      summary: Remove a member from the organization (the last owner cannot be removed)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/members/{userId}/invite:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: regenerateInvite
      summary: Issue a new invite link for a member who has not accepted yet (old links stop working)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /account-tokens/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: inspectAccountToken
      summary: What a one-time invite / password-reset link is for (no sign-in required)
      security: []
      responses:
        '200':
          description: Valid link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenInfo'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: acceptAccountToken
      summary: Set the password (and name, for invitations) using a one-time link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAccountTokenRequest'
      responses:
        '204':
          description: Password set; sign in with it
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orgs/{orgId}/partners:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listPartners
      summary: Partners of the organization (ADR-031)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createPartner
      summary: Create a partner (owner/admin)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/partners/{partnerId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartnerId'
    get:
      operationId: getPartner
      summary: One partner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      operationId: updatePartner
      summary: Edit a partner; a code change renames the prefix of its site codes (ADR-030/031)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deletePartner
      summary: Soft-delete a partner without live units (owner/admin)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/partners/{partnerId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartnerId'
    get:
      operationId: listPartnerMembers
      summary: Users granted on the partner (organization owner/admin or partner_admin; unknown emails get an invite link)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantMemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addPartnerMember
      summary: Add (organization owner/admin or partner_admin; unknown emails get an invite link)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerGrantInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddGrantResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/partners/{partnerId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/PartnerId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updatePartnerMember
      summary: Change a partner grant (optimistic lock on version)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerGrantUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removePartnerMember
      summary: Revoke a partner grant
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orgs/{orgId}/business-units:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listBusinessUnits
      summary: Business units of the organization, each under a partner (ADR-031)
      parameters:
        - name: partnerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUnitList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createBusinessUnit
      summary: Create a unit under a partner (owner/admin)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUnitInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/business-units/{businessUnitId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/BusinessUnitId'
    get:
      operationId: getBusinessUnit
      summary: One business unit
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      operationId: updateBusinessUnit
      summary: Edit a unit (its partner cannot change)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUnitUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessUnit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteBusinessUnit
      summary: Soft-delete a unit without live sites (owner/admin)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/business-units/{businessUnitId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/BusinessUnitId'
    get:
      operationId: listUnitMembers
      summary: Users granted on the unit (organization owner/admin, partner_admin of its partner or unit_admin; unknown emails get an invite link)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantMemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addUnitMember
      summary: Add (organization owner/admin, partner_admin of its partner or unit_admin; unknown emails get an invite link)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitGrantInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddGrantResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

