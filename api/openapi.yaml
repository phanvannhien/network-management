        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ntb_session

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization (tenant) the request is scoped to (ADR-023)
      schema:
        type: string
        format: uuid
    AuditPageNumber:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    DeviceQuery:
      name: q
      in: query
      description: Substring of hostname, serial, part number, model or asset tag
      schema:
        type: string
        maxLength: 200

    DevicePartnerFilter:
      name: partnerId
      in: query
      schema:
        type: string
        format: uuid

    DeviceUnitFilter:
      name: businessUnitId
      in: query
      schema:
        type: string
        format: uuid

    DeviceSiteFilter:
      name: siteId
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid

    DeviceTypeFilter:
      name: type
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/DeviceType'

    DeviceVendorFilter:
      name: vendor
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          type: string

    DeviceLifecycleFilter:
      name: lifecycle
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/DeviceLifecycle'

    DeviceRoleFilter:
      name: role
      in: query
      schema:
        type: array
        maxItems: 100
        items:
          $ref: '#/components/schemas/DeviceRole'

    DeviceTagFilter:
      name: tag
      in: query
      description: Devices carrying any of the tags
      schema:
        type: array
        maxItems: 100
        items:
          type: string

    DeviceClusterFilter:
      name: clusterId
      in: query
      description: Devices in any of the clusters
      schema:
        type: array
        maxItems: 100
        items:
          type: string
          format: uuid
    DeviceSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [hostname, mgmtIp, type, vendor, model, serial, site, unit, lifecycle, warrantyEnd]
        default: hostname

    DeviceSortDesc:
      name: desc
      in: query
      schema:
        type: boolean
        default: false

    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InterfaceId:
      name: interfaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IpId:
      name: ipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FieldId:
      name: fieldId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    AuditQuery:
      name: q
      in: query
      description: Case-insensitive text in action, object id or actor email
      schema:
        type: string
        maxLength: 200
    AuditCategory:
      name: category
      in: query
      description: Action prefix before the dot (auth, mfa, member, organization, user, …); repeatable
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          pattern: '^[a-z_]{1,40}$'
    AuditActor:
      name: actorId
      in: query
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      description: Inclusive lower bound on the event time
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Exclusive upper bound on the event time
      schema:
        type: string
        format: date-time
    PartnerId:
      name: partnerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BusinessUnitId:
      name: businessUnitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RackId:
      name: rackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Not found (also returned for organizations the caller does not belong to)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Signed in but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state (stale version, duplicate name, non-empty container, MFA state)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCode:
      description: The code is wrong, expired or already used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Health:
      type: object
      required: [status, version, environment, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        environment:
          description: Deployment name from NTB_ENV (production, staging, development…); the UI badges non-production
          type: string
        database:
          type: string
          enum: [ok, unavailable]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024

    CurrentUser:
      type: object
      required: [id, email, displayName, isSystemAdmin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        isSystemAdmin:
          type: boolean

    AuthSession:
      type: object
      required: [user, csrfToken, mfa, activeOrganizationId, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
        mfa:
          $ref: '#/components/schemas/MfaStatus'
        activeOrganizationId:
          description: Organization used last (UI default only; access is checked per request)
          type: [string, 'null']
          format: uuid
        expiresAt:
          description: When the session ends if idle (sliding, capped by the 7-day absolute limit)
          type: string
          format: date-time

