    Subnet:
      type: object
      required: [id, cidr, vrf, gateway, description, siteId, siteCode, vlanId, vlanVid, vlanName, vlanColor, size, usedCount, rangeCount, access, version]
      properties:
        id:
          type: string
          format: uuid
        cidr:
          type: string
          description: Network in CIDR form, e.g. 10.72.114.0/24 (host bits are cleared)
        vrf:
          type: string
          maxLength: 64
        gateway:
          type: [string, 'null']
          description: Gateway address inside the subnet, e.g. 10.72.114.1
        description:
          type: string
          maxLength: 500
        siteId:
          type: [string, 'null']
          format: uuid
        vlanId:
          type: [string, 'null']
          format: uuid
        siteCode:
