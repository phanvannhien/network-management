      type: string
      enum: [dhcp, static, reserved]

    IpRangeInput:
      type: object
      required: [startIp, endIp, kind]
      properties:
        startIp:
          type: string
        endIp:
          type: string
        kind:
          $ref: '#/components/schemas/IpRangeKind'
        purpose:
          type: string
          maxLength: 200

    IpRangeUpdate:
      type: object
      required: [startIp, endIp, kind, version]
      properties:
        startIp:
          type: string
        endIp:
          type: string
        kind:
          $ref: '#/components/schemas/IpRangeKind'
        purpose:
          type: string
          maxLength: 200
        version:
          type: integer
          format: int32

    IpRange:
      type: object
      required: [id, startIp, endIp, kind, purpose, size, usedCount, version]
      properties:
        id:
          type: string
          format: uuid
        startIp:
          type: string
        endIp:
          type: string
        kind:
          $ref: '#/components/schemas/IpRangeKind'
        purpose:
          type: string
          maxLength: 200
        size:
          type: integer
          format: int64
        usedCount:
          type: integer
          format: int64
        version:
          type: integer
          format: int32

    NextFreeIp:
      type: object
      required: [address, host]
      properties:
        address:
          type: [string, 'null']
          description: The free address with the subnet prefix (e.g. 10.72.114.38/24); null when the subnet is full
        host:
          type: [string, 'null']

    IpLookup:
      type: object
      required: [ip, subnets, assignments, hiddenCount]
      properties:
        ip:
          type: string
        subnets:
          type: array
          items:
            $ref: '#/components/schemas/Subnet'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/IpAssignment'
        hiddenCount:
          type: integer
          format: int64
