    DiagramInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
        layer:
          $ref: '#/components/schemas/DiagramLayer'
        description:
          type: string
          maxLength: 1000

    DiagramMetaUpdate:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          maxLength: 120
        layer:
          $ref: '#/components/schemas/DiagramLayer'
        description:
          type: string
          maxLength: 1000
        version:
          type: integer
          format: int32

    Diagram:
      type: object
      required: [id, name, layer, description, nodeCount, updatedAt, access, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        layer:
          $ref: '#/components/schemas/DiagramLayer'
        description:
          type: string
        nodeCount:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
        access:
          $ref: '#/components/schemas/AccessLevel'
        version:
          type: integer
          format: int32

    DiagramList:
      type: object
      required: [diagrams]
      properties:
        diagrams:
          type: array
          items:
            $ref: '#/components/schemas/Diagram'

    DiagramPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number

    DiagramNode:
      type: object
      required: [id, refKind, refId, x, y]
      properties:
        id:
          type: string
          maxLength: 64
        refKind:
          type: string
          enum: [device, endpoint_group, site, diagram]
        refId:
          type: string
          format: uuid
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        locked:
          type: boolean
        labelStyle:
          type: object
          additionalProperties:
            type: string

    DiagramEdge:
      type: object
      required: [id, linkId]
      properties:
        id:
          type: string
          maxLength: 64
        linkId:
          type: string
          format: uuid
        routing:
          type: string
          enum: [straight, orthogonal, curved]
        waypoints:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DiagramPoint'

    DiagramAnnotation:
      type: object
      required: [id, kind, x, y]
      properties:
        id:
          type: string
          maxLength: 64
        kind:
          type: string
          enum: [text, arrow, zone, ipPlan, legend]
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        text:
          type: string
          maxLength: 2000
        color:
          type: string
          maxLength: 20
        fontSize:
          type: number
        points:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DiagramPoint'
        siteId:
          type: [string, 'null']
          format: uuid
          description: >-
            zone only (ADR-032): a frame bound to a site, named after it; a new device dropped inside takes this site
        locationId:
          type: [string, 'null']
          format: uuid
          description: zone only — a frame bound to a location of the site (building / floor / room)
        lineStyle:
          type: string
          enum: [solid, dashed]
          description: arrows

