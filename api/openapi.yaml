        vrf:
          type: string
          maxLength: 64
        gateway:
          type: [string, 'null']
          description: Gateway address inside the subnet, e.g. 10.72.114.1
        description:
          type: string
          maxLength: 500
        siteId:
          type: [string, 'null']
          format: uuid
        vlanId:
          type: [string, 'null']
          format: uuid
        version:
