    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/DeviceId'
    put:
      operationId: setDeviceMgmtIp
      summary: Set the management IP in one step (property panel) — on the management interface, created if missing
      description: >-
        The address goes on the device's management interface (replacing its primary address of that family); with none,
        on a "Vlan1" SVI for switches / a "mgmt" interface otherwise, which becomes the management interface. A bare
        address takes the prefix of the IPAM subnet holding it, else /32. The same address elsewhere is a warning
        (ADR-034), not a refusal.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgmtIpResult'
        '400':
          $ref: '#/components/responses/BadRequest'
