openapi: 3.1.0
info:
  title: Network Topology Builder API
  version: 0.1.0
  description: |
    Contract between frontend and backend (ADR-017). Edit this file first, then run `make gen`.

    Authentication: session cookie `ntb_session` (HttpOnly, SameSite=Lax) set by POST /auth/login.
    Every state-changing request except login must send header `X-CSRF-Token` with the token
    returned by /auth/login or /auth/me.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness + database check
      security: []
      responses:
        '200':
          description: API and database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: API is up but the database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and clear the session cookie
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentSession
      summary: Current user and CSRF token
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/mfa/setup:
    post:
      operationId: setupMfa
      summary: Start TOTP enrollment (returns the secret and a QR code once)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Enrollment started; confirm with /auth/mfa/enable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/enable:
    post:
      operationId: enableMfa
      summary: Confirm enrollment with a code; returns one-time recovery codes
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '200':
          description: MFA enabled; recovery codes are shown only now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRecoveryCodes'
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Complete sign-in with a TOTP code or a recovery code
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Session is now MFA-verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Too many attempts; retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/mfa/disable:
    post:
      operationId: disableMfa
      summary: Turn off MFA (not allowed when MFA is mandatory for the account)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '204':
          description: MFA disabled
        '400':
          $ref: '#/components/responses/InvalidCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: MFA is mandatory for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs:
    get:
      operationId: listMyOrganizations
      summary: Organizations the current user belongs to
      responses:
        '200':
          description: Memberships, sorted by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOrganizations'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orgs/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: getOrganization
      summary: Organization details and the caller's membership
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOrganization
      summary: Rename / edit notes (owner, admin). Optimistic lock on version.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/activate:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      operationId: activateOrganization
      summary: Remember this organization as the default to open after sign-in
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Saved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/organizations:
    get:
      operationId: adminListOrganizations
      summary: All organizations (system admin)
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: adminCreateOrganization
      summary: Create an organization (system admin)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/organizations/{orgId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    delete:
      operationId: adminDeleteOrganization
      summary: Soft-delete an organization (system admin, ADR-022)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted (hidden everywhere; history kept)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orgs/{orgId}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listMembers
      summary: Members of the organization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addMember
      summary: Add a member by email (owner/admin/user.manage); unknown emails get a one-time invite link
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddMemberResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateMember
      summary: Change role / extra permissions (optimistic lock on version)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMember
      summary: Remove a member from the organization (the last owner cannot be removed)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/members/{userId}/invite:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: regenerateInvite
      summary: Issue a new invite link for a member who has not accepted yet (old links stop working)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /account-tokens/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    get:
      operationId: inspectAccountToken
      summary: What a one-time invite / password-reset link is for (no sign-in required)
      security: []
      responses:
        '200':
          description: Valid link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenInfo'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: acceptAccountToken
      summary: Set the password (and name, for invitations) using a one-time link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAccountTokenRequest'
      responses:
        '204':
          description: Password set; sign in with it
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orgs/{orgId}/sites:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listSites
      summary: Sites of the organization (filtered by the member site scope)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createSite
      summary: Create a site (owner/admin/editor without a site scope)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSite
      summary: One site
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      operationId: updateSite
      summary: Edit a site (optimistic lock on version)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteSite
      summary: Soft-delete a site (owner/admin)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/sites/{siteId}/locations:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listLocations
      summary: Location tree of the site as a flat list (parentId links)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createLocation
      summary: Add a building, floor or room
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/sites/{siteId}/locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/LocationId'
    patch:
      operationId: updateLocation
      summary: Rename / reorder a location
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteLocation
      summary: Delete an empty location (409 while it has children or racks)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/sites/{siteId}/racks:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listRacks
      summary: Racks of the site
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: createRack
      summary: Add a rack to a location of the site
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RackInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/sites/{siteId}/racks/{rackId}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/RackId'
    patch:
      operationId: updateRack
      summary: Edit / move a rack within the site
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RackUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteRack
      summary: Delete an empty rack
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /orgs/{orgId}/audit:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      operationId: listOrgAudit
      summary: Audit log of the organization (owner/admin), newest first
      parameters:
        - $ref: '#/components/parameters/AuditPageNumber'
        - $ref: '#/components/parameters/AuditPageSize'
        - $ref: '#/components/parameters/AuditQuery'
        - $ref: '#/components/parameters/AuditCategory'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/audit:
    get:
      operationId: listSystemAudit
      summary: System-level audit events without an organization (system admin), newest first
      parameters:
        - $ref: '#/components/parameters/AuditPageNumber'
        - $ref: '#/components/parameters/AuditPageSize'
        - $ref: '#/components/parameters/AuditQuery'
        - $ref: '#/components/parameters/AuditCategory'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users:
    get:
      operationId: adminListUsers
      summary: All users (system admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/disable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: adminDisableUser
      summary: Disable a user (soft delete, signs them out everywhere)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/users/{userId}/enable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: adminEnableUser
      summary: Re-enable a disabled user
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{userId}/reset-mfa:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: adminResetMfa
      summary: Remove MFA so the user can enroll again (lost phone and recovery codes)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{userId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: adminCreatePasswordReset
      summary: Issue a one-time password-reset link (24 h)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ntb_session

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization (tenant) the request is scoped to (ADR-023)
      schema:
        type: string
        format: uuid
    AuditPageNumber:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    AuditPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    AuditQuery:
      name: q
      in: query
      description: Case-insensitive text in action, object id or actor email
      schema:
        type: string
        maxLength: 200
    AuditCategory:
      name: category
      in: query
      description: Action prefix before the dot (auth, mfa, member, organization, user, …); repeatable
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          pattern: '^[a-z_]{1,40}$'
    AuditActor:
      name: actorId
      in: query
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      description: Inclusive lower bound on the event time
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      description: Exclusive upper bound on the event time
      schema:
        type: string
        format: date-time
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RackId:
      name: rackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Not found (also returned for organizations the caller does not belong to)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Signed in but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicts with the current state (stale version, duplicate name, non-empty container, MFA state)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCode:
      description: The code is wrong, expired or already used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Health:
      type: object
      required: [status, version, environment, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        environment:
          description: Deployment name from NTB_ENV (production, staging, development…); the UI badges non-production
          type: string
        database:
          type: string
          enum: [ok, unavailable]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 1024

    CurrentUser:
      type: object
      required: [id, email, displayName, isSystemAdmin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        isSystemAdmin:
          type: boolean

    AuthSession:
      type: object
      required: [user, csrfToken, mfa, activeOrganizationId, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        csrfToken:
          type: string
        mfa:
          $ref: '#/components/schemas/MfaStatus'
        activeOrganizationId:
          description: Organization used last (UI default only; access is checked per request)
          type: [string, 'null']
          format: uuid
        expiresAt:
          description: When the session ends if idle (sliding, capped by the 7-day absolute limit)
          type: string
          format: date-time

    MfaStatus:
      type: object
      description: |
        enabled = TOTP enrolled; verified = code entered this session; required = mandatory for this
        account (system admin / org owner / org admin). The session is fully usable only when
        (enabled and verified) or (not enabled and not required).
      required: [enabled, verified, required]
      properties:
        enabled:
          type: boolean
        verified:
          type: boolean
        required:
          type: boolean
        verifiedAt:
          description: When MFA was last entered in this session (re-verify gates, e.g. secret reveal, use it)
          type: [string, 'null']
          format: date-time

    MfaSetup:
      type: object
      required: [secret, otpauthUrl, qrCode]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry
        otpauthUrl:
          type: string
        qrCode:
          type: string
          description: PNG data URL of the otpauth QR code

    MfaCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16

    MfaVerifyRequest:
      type: object
      description: Provide either a TOTP code or a recovery code.
      properties:
        code:
          type: string
          maxLength: 16
        recoveryCode:
          type: string
          maxLength: 32

    MfaRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    OrganizationKind:
      type: string
      enum: [internal, customer]

    Role:
      type: string
      enum: [owner, admin, editor, viewer]

    OrganizationSummary:
      type: object
      required: [id, name, kind, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        role:
          $ref: '#/components/schemas/Role'

    MyOrganizations:
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummary'

    Organization:
      type: object
      required: [id, name, kind, notes, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MembershipInfo:
      type: object
      required: [role, permissions]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string

    OrganizationView:
      type: object
      required: [organization, membership]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        membership:
          $ref: '#/components/schemas/MembershipInfo'

    UpdateOrganizationRequest:
      type: object
      required: [name, notes, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 2000
        version:
          type: integer
          format: int32
          description: Version the client last saw; mismatch → 409

    AdminOrganization:
      type: object
      required: [id, name, kind, notes, memberCount, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
        memberCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int32

    AdminOrganizationList:
      type: object
      required: [organizations]
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganization'

    CreateOrganizationRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        notes:
          type: string
          maxLength: 2000
        addMeAsOwner:
          type: boolean
          default: true
          description: Make the creating system admin an owner (otherwise nobody can access it until P1-04 adds members)

    Permission:
      type: string
      enum: [credential.reveal, credential.manage, user.manage]

    Member:
      type: object
      required: [userId, email, displayName, role, permissions, mfaEnabled, disabled, pendingInvite, version]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        mfaEnabled:
          type: boolean
        disabled:
          type: boolean
        pendingInvite:
          type: boolean
          description: Invited but has not set a password yet
        siteScope:
          description: Sites the member is limited to (null = every site; ignored for owner/admin, ADR-025)
          type: [array, 'null']
          items:
            type: string
            format: uuid
        version:
          type: integer
          format: int32

    MemberList:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    AddMemberResult:
      type: object
      required: [member, inviteToken]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        inviteToken:
          description: One-time invite token for a new user (build the link /invite/{token}); null for existing users
          type: [string, 'null']

    UpdateMemberRequest:
      type: object
      required: [role, permissions, version]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        siteScope:
          $ref: '#/components/schemas/SiteScopeInput'
        version:
          type: integer
          format: int32

    InviteLink:
      type: object
      required: [inviteToken]
      properties:
        inviteToken:
          type: string

    PasswordResetLink:
      type: object
      required: [resetToken]
      properties:
        resetToken:
          type: string
          description: One-time token (build the link /invite/{token})

    AccountTokenInfo:
      type: object
      required: [email, purpose, organizations]
      properties:
        email:
          type: string
        purpose:
          type: string
          enum: [invite, password_reset]
        organizations:
          type: array
          items:
            type: string

    AcceptAccountTokenRequest:
      type: object
      required: [password]
      properties:
        displayName:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 1024

    AuditActorRef:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string

    AuditEntry:
      type: object
      description: One append-only audit record. before/after never contain secrets.
      required: [id, createdAt, actor, action, objectType, objectId, before, after, ip, userAgent, requestId]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        actor:
          oneOf:
            - $ref: '#/components/schemas/AuditActorRef'
            - type: 'null'
        action:
          type: string
        objectType:
          type: string
        objectId:
          type: string
        before:
          description: Snapshot before the change (null when not applicable)
        after:
          description: Snapshot after the change (null when not applicable)
        ip:
          type: string
        userAgent:
          type: string
        requestId:
          type: string

    AuditPage:
      type: object
      required: [entries, total, page, pageSize]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32

    SiteScopeInput:
      type: object
      description: Omit to keep the current scope. all=true removes the limit; otherwise only siteIds (owner/admin only).
      required: [all, siteIds]
      properties:
        all:
          type: boolean
        siteIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid

    SiteInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 200
        address:
          type: string
          maxLength: 500
        timezone:
          type: string
          description: IANA time zone (default Asia/Ho_Chi_Minh)
        contactName:
          type: string
          maxLength: 200
        contactPhone:
          type: string
          maxLength: 50
        contactEmail:
          type: string
          maxLength: 320
        notes:
          type: string
          maxLength: 2000

    SiteUpdate:
      allOf:
        - $ref: '#/components/schemas/SiteInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32

    Site:
      type: object
      required: [id, code, name, address, timezone, contactName, contactPhone, contactEmail, notes, locationCount, rackCount, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        address:
          type: string
        timezone:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        notes:
          type: string
        locationCount:
          type: integer
          format: int64
        rackCount:
          type: integer
          format: int64
        version:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteList:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'

    LocationKind:
      type: string
      enum: [building, floor, room]

    LocationInput:
      type: object
      required: [kind, name]
      properties:
        parentId:
          type: [string, 'null']
          format: uuid
        kind:
          $ref: '#/components/schemas/LocationKind'
        name:
          type: string
          maxLength: 100
        sortOrder:
          type: integer
          format: int32

    LocationUpdate:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          maxLength: 100
        sortOrder:
          type: integer
          format: int32
        version:
          type: integer
          format: int32

    Location:
      type: object
      required: [id, parentId, kind, name, sortOrder, version]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        kind:
          $ref: '#/components/schemas/LocationKind'
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        version:
          type: integer
          format: int32

    LocationList:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'

    RackInput:
      type: object
      required: [locationId, name]
      properties:
        locationId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        uHeight:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        notes:
          type: string
          maxLength: 2000

    RackUpdate:
      allOf:
        - $ref: '#/components/schemas/RackInput'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int32

    Rack:
      type: object
      required: [id, locationId, name, uHeight, notes, version]
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        name:
          type: string
        uHeight:
          type: integer
          format: int32
        notes:
          type: string
        version:
          type: integer
          format: int32

    RackList:
      type: object
      required: [racks]
      properties:
        racks:
          type: array
          items:
            $ref: '#/components/schemas/Rack'

    AdminUser:
      type: object
      required: [id, email, displayName, isSystemAdmin, mfaEnabled, disabled, pendingInvite, organizationCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        isSystemAdmin:
          type: boolean
        mfaEnabled:
          type: boolean
        disabled:
          type: boolean
        pendingInvite:
          type: boolean
        organizationCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    AdminUserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
