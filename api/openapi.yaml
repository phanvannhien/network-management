      type: object
      required: [nodes, edges, annotations]
      properties:
        nodes:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/DiagramNode'
        edges:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/DiagramEdge'
        annotations:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/DiagramAnnotation'
        viewport:
          $ref: '#/components/schemas/DiagramViewport'
        labelTemplate:
          type: string
          maxLength: 200
        portStyle:
          type: string
          enum: [compact, cisco, full]
          description: port names at cable ends — compact g1/0/24 (default), cisco Gi1/0/24, full GigabitEthernet1/0/24

    DiagramDetail:
      type: object
      required: [diagram, view, devices, endpointGroups, links, hiddenRefs]
      properties:
        diagram:
          $ref: '#/components/schemas/Diagram'
        view:
          $ref: '#/components/schemas/DiagramView'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        endpointGroups:
          type: array
          items:
            $ref: '#/components/schemas/EndpointGroup'
        links:
          type: array
          description: links whose both ends are nodes of the view
          items:
            $ref: '#/components/schemas/Link'
        hiddenRefs:
          type: array
          description: ids referenced by the view that the caller may not see (kept unchanged when saving)
          items:
            type: string
            format: uuid

    DiagramChange:
      type: object
      required: [op]
      description: >-
        One inventory change made in the editor. createDevice / createLink carry a client tempId (a UUID) that view
        nodes, edges and later changes may reference; the result maps it to the real id.
      properties:
        op:
          type: string
          enum: [createDevice, updateDevice, deleteDevice, createLink, updateLink, deleteLink, createEndpointGroup, updateEndpointGroup]
        tempId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        device:
          $ref: '#/components/schemas/DeviceInput'
        portTempIds:
          type: array
          maxItems: 1024
          description: >-
            createDevice with a template (P1-17): client temp ids of the ports the template will generate, by name, so
            cables drawn before saving can name them; the result maps them to the real interface ids.
          items:
            $ref: '#/components/schemas/PortTempId'
        deviceUpdate:
          $ref: '#/components/schemas/DeviceUpdate'
        link:
          $ref: '#/components/schemas/LinkInput'
        linkUpdate:
          $ref: '#/components/schemas/LinkUpdate'
        endpointGroup:
          $ref: '#/components/schemas/EndpointGroupInput'
          description: createEndpointGroup — a group of endpoints drawn on the diagram (ADR-036), with a tempId
        endpointGroupUpdate:
          $ref: '#/components/schemas/EndpointGroupUpdate'

    PortTempId:
      type: object
      required: [name, tempId]
      properties:
        name:
          type: string
          maxLength: 64
        tempId:
          type: string
          format: uuid

