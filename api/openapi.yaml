      properties:
        kind: {type: string, enum: [hostname, serial, ip]}
        severity:
          type: string
          enum: [error, warning]
          description: warning for a NAT / public copy or a device not in service yet
        deviceId: {type: string, format: uuid}
        value: {type: string}
        other: {type: string}
        otherInterface: {type: string}

    DeviceImpact:
      type: object
      required: [id, hostname, siteCode, clusterName, clusterMembersLeft, ipCount]
      properties:
        id:
