          required: [ranges, ips, hiddenCount]
          properties:
            ranges:
              type: array
              items:
                $ref: '#/components/schemas/IpRange'
            ips:
              type: array
              items:
                $ref: '#/components/schemas/IpAssignment'
            hiddenCount:
              type: integer
              format: int64
              description: Addresses used by devices the caller may not see

