# Security headers (P2-01). Included at server level and again in every location that has its own add_header
# (nginx does not inherit add_header into a location that sets any).
# style-src 'unsafe-inline': the toast library and the image export set style attributes; no inline script is allowed.
# img-src/font-src data: and blob: — the MFA QR code, diagram export (html-to-image) and file downloads.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Only honoured by browsers over HTTPS (TLS is terminated by the proxy in front of this container).
add_header Strict-Transport-Security "max-age=31536000" always;
