server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Go API: /api is forwarded untouched (same layout as the Vite dev proxy).
    # Must come before the SPA fallback so API 404s are never answered with index.html.
    location /api/ {
        # .ntb.json imports and Excel import chunks are larger than nginx's 1 MB default.
        client_max_body_size 25m;
        proxy_pass http://api:8069;
        proxy_http_version 1.1;
        # $http_host keeps the port so the API's Origin == Host CSRF check matches the browser origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static assets with hashing — cache aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
