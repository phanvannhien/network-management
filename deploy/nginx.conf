# The scheme the user really used: a TLS proxy in front sends X-Forwarded-Proto: https (keep it), otherwise this
# container's own scheme. The API marks the session cookie Secure from it.
map $http_x_forwarded_proto $ntb_proto {
    default $scheme;
    https   https;
}

# Access log without the bearer tokens of invitation / password-reset links (only their first characters).
map $request_uri $ntb_log_uri {
    "~^(?<pre>/invite/|/api/account-tokens/)(?<keep>[A-Za-z0-9_-]{4})[A-Za-z0-9_-]*(?<rest>.*)$" "$pre$keep…$rest";
    default $request_uri;
}
log_format ntb '$remote_addr - [$time_local] "$request_method $ntb_log_uri" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log ntb;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Go API: /api is forwarded untouched (same layout as the Vite dev proxy).
    # Must come before the SPA fallback so API 404s are never answered with index.html.
    location /api/ {
        # .ntb.json imports and Excel import chunks are larger than nginx's 1 MB default.
        client_max_body_size 25m;
        proxy_pass http://api:8069;
        proxy_http_version 1.1;
        # $http_host keeps the port so the API's Origin == Host CSRF check matches the browser origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ntb_proto;
        proxy_read_timeout 60s;
    }

    # Static assets with hashing — cache aggressively
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app shell: always revalidated, so a new release is picked up at once.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
